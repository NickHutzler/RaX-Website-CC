<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Test page: keep search engines from indexing it.  Remove this line when the real site goes live. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Hello, world</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #161616; color: #eee; }
    }
    main { text-align: center; padding: 16px; }
    h1 { font-size: 2.5rem; margin: 0 0 0.5rem; }
    p { margin: 0; opacity: 0.7; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <p>This is a test page for GitHub Pages.</p>
  </main>
</body>
</html>
